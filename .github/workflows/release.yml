# 由 build/workflow.csx 生成 —— 请勿手工编辑，改脚本后重新生成
name: 跨平台构建与发布

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后是否发布安装包（上传 Releases，仓库页面可直接下载）'
        type: boolean
        default: true
      formats:
        description: '分发格式（逗号分隔：zip,setup,deb,dmg）'
        type: string
        default: 'zip,setup,deb,dmg'
      self_contained:
        description: '生成自包含包（目标机无需预装 .NET）'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: 构建 ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装打包脚本依赖
        run: |
          dotnet tool install -g dotnet-script
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        shell: bash

      # 构建是交叉编译，不需要 WebKit —— 它是运行时依赖，
      # 仅目标 Linux 机器安装时才需要（apt install libwebkit2gtk-4.1-0）。
      - name: 核心算法自测
        run: |
          dotnet build ColorCardStudio.csproj -c Release --nologo
          ./bin/Release/net8.0/ColorMod --selftest

      - name: 生成安装包
        shell: bash
        run: |
          set -euo pipefail
          FORMATS='${{ inputs.formats }}'
          [ -z "$FORMATS" ] && FORMATS='zip,setup,deb,dmg'
          ARGS="--runtime ${{ matrix.rid }} --configuration Release"
          for f in ${FORMATS//,/ }; do
            ARGS="$ARGS --$f"
          done
          if [ '${{ inputs.self_contained }}' = 'true' ]; then
            ARGS="$ARGS --self-contained"
          fi
          echo ">> 打包参数: $ARGS"
          dotnet-script build/pack.csx -- $ARGS

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ColorMod-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/**
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/PLATFORMS.md
          if-no-files-found: warn
          retention-days: 30

  release:
    name: 汇总并分发安装包
    needs: build
    runs-on: ubuntu-latest
    # always()：单个平台失败/超时不能阻塞发布 ——
    # 其余平台已构建成功时，仍应把产物传上 Releases。
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish != false)

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ColorMod-*
          merge-multiple: true

      - name: 列出产物
        run: |
          find dist -maxdepth 2 -type f \( -name '*.zip' -o -name '*.deb' \
            -o -name '*.dmg' -o -name '*Setup*.exe' \) -printf '%p  %s bytes\n' | sort

      - name: 生成安装说明
        shell: bash
        run: |
          {
            echo '## ColorMod 色卡工坊'
            echo
            echo 'CMYK 色卡查询与图片取色工具。下载对应平台的安装包：'
            echo
            echo '| 平台 | 安装包 | 使用方式 |'
            echo '| --- | --- | --- |'
            echo '| Windows x64 | `ColorMod-Setup-win-x64.exe` | 双击即安装，目标机无需 .NET |'
            echo '| Linux x64 | `colormod_*_amd64.deb` | `sudo dpkg -i *.deb` |'
            echo '| macOS Apple Silicon | `ColorMod-osx-arm64-*.dmg` | 拖入应用程序 |'
            echo
            echo '其余平台见下方附件（zip 为通用包，解压后直接运行）。'
            echo
            echo '### Linux 运行时依赖'
            echo '### Linux 运行时依赖'
            echo 'WebKit 是运行时依赖，安装后如无法启动请执行：'
            echo
            echo '```bash'
            echo '# Ubuntu 24.04+ / Debian 12+'
            echo 'sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0'
            echo '```'
          } > dist/INSTALL.md

      - name: 删除同名旧 Release
        shell: bash
        run: gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: 发布安装包到 Releases
        uses: softprops/action-gh-release@v2
        with:
          # 普通 push / 手动触发统一用 rolling 标签，保证仓库页面始终可下载
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'rolling' }}
          name: ColorMod 色卡工坊 ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'rolling' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/*.zip
            dist/*.deb
            dist/*.dmg
            dist/*Setup*.exe
            dist/INSTALL.md
          fail_on_unmatched_files: false
          generate_release_notes: true
