name: 跨平台构建与发布

# 触发条件：
#   push 到 main/master  -> 仅构建（build-only）
#   手动触发            -> 完整构建 + 上传产物
#   打 tag (v*)         -> 构建并发布 Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布 Release'
        type: boolean
        default: false
      formats:
        description: '分发格式（逗号分隔：zip,setup,deb,dmg）'
        type: string
        default: 'zip,setup,deb,dmg'
      self_contained:
        description: '生成自包含包（目标机无需预装 .NET）'
        type: boolean
        default: true

permissions:
  contents: write   # 发布 Release 需要

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: 构建 ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # 同一矩阵内任一平台失败则整体失败；产物互不依赖，可并发
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-13
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore ColorCardStudio.csproj

      - name: 核心算法自测
        # 云构建必须先过自测，避免把坏版本发出去
        run: |
          dotnet build ColorCardStudio.csproj -c Release --nologo
          ./bin/Release/net8.0/ColorMod --selftest

      - name: 还原打包脚本依赖
        run: dotnet tool install -g dotnet-script
        if: runner.os == 'Windows'
      - name: 还原打包脚本依赖（Unix）
        run: |
          dotnet tool install -g dotnet-script
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        if: runner.os != 'Windows'

      # Linux 需要 WebKit 运行时才能构建/校验（Photino 依赖）
      - name: 安装 WebKit 运行时（Linux）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-37 libgtk-3-0
        if: runner.os == 'Linux'

      - name: 生成安装包
        shell: bash
        run: |
          set -euo pipefail
          FORMATS='${{ inputs.formats }}'
          [ -z "$FORMATS" ] && FORMATS='zip,setup,deb,dmg'
          ARGS="--runtime ${{ matrix.rid }} --configuration Release"
          for f in ${FORMATS//,/ }; do
            ARGS="$ARGS --$f"
          done
          if [ '${{ inputs.self_contained }}' = 'true' ] || [ '${{ github.event_name }}' = 'push' ]; then
            ARGS="$ARGS --self-contained"
          fi
          echo "▶ 打包参数: $ARGS"
          dotnet-script build/pack.csx -- $ARGS

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ColorMod-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/**
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/PLATFORMS.md
          if-no-files-found: warn
          retention-days: 30

  release:
    name: 汇总并发布 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ColorMod-*
          merge-multiple: true

      - name: 列出待发布文件
        run: |
          echo "## 待发布内容" >> "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 2 -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.dmg' -o -name '*Setup*.exe' \) \
            -printf '%f  %s bytes\n' | sort | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 生成安装说明
        run: |
          {
            echo "## ColorMod 色卡工坊"
            echo
            echo "CMYK 色卡查询与图片取色工具。下载对应平台的安装包："
            echo
            echo '| 平台 | 安装包 | 使用方式 |'
            echo '| --- | --- | --- |'
            echo '| Windows x64 | `ColorMod-Setup-win-x64.exe` | 双击即安装，无需 .NET |'
            echo '| Linux x64 | `colormod_*_amd64.deb` | `sudo dpkg -i *.deb` |'
            echo '| macOS Apple Silicon | `ColorMod-osx-arm64-*.dmg` | 拖入应用程序 |'
            echo
            echo "其余平台见下方附件（zip 通用包）。"
          } > dist/INSTALL.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.deb
            dist/*.dmg
            dist/*Setup*.exe
            dist/INSTALL.md
          fail_on_unmatched_files: false
          generate_release_notes: true